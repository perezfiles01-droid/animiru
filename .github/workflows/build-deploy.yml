name: Build & Deploy Animiru

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Plain npm install - no flags. Do NOT add --legacy-peer-deps or
      # --force: they let npm ignore peer constraints and hoist ajv@6
      # alongside ajv-keywords@5, which breaks the react-scripts build with
      # "Cannot find module 'ajv/dist/compile/codegen'".
      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      # The API base URL is compiled into the bundle by Create React App, so
      # it is fixed at build time and cannot be configured on the device.
      # Extensions execute on that backend, so a build without it produces an
      # app that installs, opens, and can run nothing.
      #
      # The default below is this project's deployed backend, which is a
      # public endpoint rather than a secret. Set a repository variable named
      # REACT_APP_API_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) to point a build somewhere else; it wins when present.
      - name: Resolve backend URL
        id: backend
        run: |
          URL="${{ vars.REACT_APP_API_URL }}"
          if [ -z "$URL" ]; then
            URL="https://animiru-livid.vercel.app/api"
            echo "Backend: $URL (workflow default)"
          else
            echo "Backend: $URL (repository variable)"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          REACT_APP_API_URL: ${{ steps.backend.outputs.url }}
        run: cd frontend && npm run build

      # A bundle that does not carry the URL cannot reach a backend, and the
      # failure only shows up after installing on a device. Cheaper to catch
      # it here than to ship an APK that quietly does nothing.
      - name: Verify the backend URL was compiled in
        run: |
          if ! grep -rqF "${{ steps.backend.outputs.url }}" frontend/build/static/js/; then
            echo "::error::The built bundle does not contain ${{ steps.backend.outputs.url }}."
            echo "::error::The app would fall back to localhost and run no extensions."
            exit 1
          fi
          echo "Verified: the bundle points at ${{ steps.backend.outputs.url }}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The APK is a WebView shell around the compiled web app, so the build
      # output has to land in the assets source set before Gradle runs.
      - name: Stage web build into APK assets
        run: |
          rm -rf mobile/android/app/src/main/assets
          mkdir -p mobile/android/app/src/main/assets
          cp -r frontend/build/. mobile/android/app/src/main/assets/
          test -f mobile/android/app/src/main/assets/index.html
          echo "Staged assets:"
          ls -la mobile/android/app/src/main/assets

      - name: Build APK (Debug)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build APK (Release)
        continue-on-error: true
        run: |
          cd mobile/android
          ./gradlew --no-daemon assembleRelease

      - name: Find APK
        run: find mobile/android -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animiru-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: animiru-apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app-debug.apk animiru-app.apk
          gh release create "v1.0.${{ github.run_number }}" animiru-app.apk \
            --title "Animiru v1.0.${{ github.run_number }}" \
            --notes "$(cat <<'NOTES'
          **Animiru — Android build**

          This APK is a WebView shell hosting the compiled React app. It is
          signed with the Android debug key, so Android will warn on install
          and it is not suitable for Play Store distribution.

          **Install**
          1. Download `animiru-app.apk` below
          2. Allow installs from unknown sources for your browser or file manager
          3. Open the APK and tap Install

          **Requires** Android 5.0 (API 21) or newer.

          **Note:** browsing and playback call the backend API, which must be
          deployed and reachable for anime data to load.
          NOTES
          )"
