name: Build & Deploy Animiru

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install backend dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Install frontend dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build APK (Debug)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build APK (Release)
        continue-on-error: true
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK
        run: find mobile/android -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: animiru-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v3

      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: animiru-apk

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Animiru v1.0.${{ github.run_number }}
          body: |
            🎉 **Animiru Anime Streaming App - Release v1.0.${{ github.run_number }}**

            📱 **APK Ready for Download**

            **Features:**
            ✅ Browse anime with AniList API
            ✅ Watch episodes with video player
            ✅ Manage personal watchlist
            ✅ Track viewing history
            ✅ User authentication & profiles
            ✅ Responsive mobile design
            ✅ Offline support (PWA)

            **Installation:**
            1. Download the APK file below
            2. Enable "Unknown Sources" in Android Settings
            3. Open the APK and tap Install

            **Requirements:**
            - Android 5.0 (API 21) or higher
            - Internet connection
            - ~50MB storage

            ---
            Built with ❤️ using React, Express, and Firebase
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app-debug.apk
          asset_name: animiru-app.apk
          asset_content_type: application/vnd.android.package-archive
