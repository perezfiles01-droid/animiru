name: Build & Deploy Animiru

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Plain npm install - no flags. Do NOT add --legacy-peer-deps or
      # --force: they let npm ignore peer constraints and hoist ajv@6
      # alongside ajv-keywords@5, which breaks the react-scripts build with
      # "Cannot find module 'ajv/dist/compile/codegen'".
      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      # The API base URL is compiled into the bundle by Create React App, so
      # it is fixed at build time and cannot be configured on the device.
      # Extensions execute on that backend, so a build without it produces an
      # app that installs, opens, and can run nothing.
      #
      # The default below is this project's deployed backend, which is a
      # public endpoint rather than a secret. Set a repository variable named
      # REACT_APP_API_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) to point a build somewhere else; it wins when present.
      - name: Resolve backend URL
        id: backend
        run: |
          URL="${{ vars.REACT_APP_API_URL }}"
          if [ -z "$URL" ]; then
            URL="https://animiru-livid.vercel.app/api"
            echo "Backend: $URL (workflow default)"
          else
            echo "Backend: $URL (repository variable)"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # The version the app reports, and compares against GitHub Releases to
      # tell whether it is out of date. It must match the tag the release job
      # creates below, or the app compares against the wrong thing and either
      # never offers an update or offers one forever.
      - name: Build frontend
        env:
          REACT_APP_API_URL: ${{ steps.backend.outputs.url }}
          REACT_APP_VERSION: v1.0.${{ github.run_number }}
        run: cd frontend && npm run build

      # A bundle that does not carry the URL cannot reach a backend, and the
      # failure only shows up after installing on a device. Cheaper to catch
      # it here than to ship an APK that quietly does nothing.
      - name: Verify the backend URL and version were compiled in
        run: |
          if ! grep -rqF "${{ steps.backend.outputs.url }}" frontend/build/static/js/; then
            echo "::error::The built bundle does not contain ${{ steps.backend.outputs.url }}."
            echo "::error::The app would fall back to localhost and run no extensions."
            exit 1
          fi
          if ! grep -rqF "v1.0.${{ github.run_number }}" frontend/build/static/js/; then
            echo "::error::The built bundle does not contain the version"
            echo "::error::v1.0.${{ github.run_number }}, so its update check would"
            echo "::error::compare against the wrong version."
            exit 1
          fi
          echo "Verified: backend ${{ steps.backend.outputs.url }}, version v1.0.${{ github.run_number }}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The APK is a WebView shell around the compiled web app, so the build
      # output has to land in the assets source set before Gradle runs.
      - name: Stage web build into APK assets
        run: |
          rm -rf mobile/android/app/src/main/assets
          mkdir -p mobile/android/app/src/main/assets
          cp -r frontend/build/. mobile/android/app/src/main/assets/
          test -f mobile/android/app/src/main/assets/index.html
          echo "Staged assets:"
          ls -la mobile/android/app/src/main/assets

      # Without a stable key every build is signed differently, Android
      # refuses to install one over another, and the only way forward is
      # uninstalling - which deletes the user's library and settings.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANIMIRU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANIMIRU_KEYSTORE_BASE64 is not set. This build is \
          signed with a throwaway debug key and will NOT install over an \
          existing Animiru without uninstalling it first."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/animiru.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK (Debug)
        env:
          ANIMIRU_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/animiru.jks', runner.temp) || '' }}
          ANIMIRU_KEYSTORE_PASSWORD: ${{ secrets.ANIMIRU_KEYSTORE_PASSWORD }}
          ANIMIRU_KEY_ALIAS: animiru
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Proves the key actually reached the APK. A misnamed secret would
      # otherwise produce a debug-signed build that looks fine here and fails
      # to install on a device, which is the failure being fixed.
      - name: Verify the APK carries the stable signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk

          # Matched by shape rather than by label. keytool writes the
          # keystore's as "Certificate fingerprint (SHA-256): AB:CD:..." and
          # the APK's as "SHA256: AB:CD:...", so no single label works - and
          # a label that matches neither yields an empty string that compares
          # unequal to everything, failing a build that was correctly signed.
          # A 32-byte colon-hex run is unambiguous in either output.
          fingerprint() { grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1; }

          EXPECTED=$(keytool -list -keystore "$RUNNER_TEMP/animiru.jks" \
            -storepass "${{ secrets.ANIMIRU_KEYSTORE_PASSWORD }}" 2>/dev/null | fingerprint)
          ACTUAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null | fingerprint)
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::The APK is not signed with the stable key, so it \
          will not install over an existing Animiru."
            exit 1
          fi

      - name: Build APK (Release)
        continue-on-error: true
        env:
          ANIMIRU_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/animiru.jks', runner.temp) || '' }}
          ANIMIRU_KEYSTORE_PASSWORD: ${{ secrets.ANIMIRU_KEYSTORE_PASSWORD }}
          ANIMIRU_KEY_ALIAS: animiru
        run: |
          cd mobile/android
          ./gradlew --no-daemon assembleRelease

      - name: Find APK
        run: find mobile/android -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animiru-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Publishing the release is what makes a build installable: the app asks
  # GitHub for the newest release and compares it against the version
  # compiled into itself, so a build that is never released is a build no
  # user is ever offered.
  #
  # This used to run on workflow_dispatch alone, which meant a merge to main
  # built an APK, uploaded it as an artifact, and published nothing - the
  # fixes were live on the backend and the app went on reporting itself up
  # to date. Main is the release branch here, so landing on it is exactly
  # the moment a build should become installable.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: animiru-apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app-debug.apk animiru-app.apk
          gh release create "v1.0.${{ github.run_number }}" animiru-app.apk \
            --title "Animiru v1.0.${{ github.run_number }}" \
            --notes "$(cat <<'NOTES'
          **Animiru — Android build**

          This APK is a WebView shell hosting the compiled React app. It is
          signed with a self-signed key, so Android will warn on install
          and it is not suitable for Play Store distribution. It installs
          over a previous Animiru without uninstalling, keeping your
          library and settings.

          **Install**
          1. Download `animiru-app.apk` below
          2. Allow installs from unknown sources for your browser or file manager
          3. Open the APK and tap Install

          **Requires** Android 5.0 (API 21) or newer.

          **Note:** browsing and playback call the backend API, which must be
          deployed and reachable for anime data to load.
          NOTES
          )"
