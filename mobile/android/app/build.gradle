plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animiru.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.animiru.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }

        release {
            // Signed with the debug key so `assembleRelease` produces an
            // installable APK without a checked-in keystore. Replace with a
            // real signingConfig before any store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    // FileProvider, and ContextCompat.registerReceiver with the exported
    // flag that API 33 requires. Both arrive transitively through appcompat,
    // but the update flow breaks on an older core and depending on it
    // explicitly says which version that is.
    implementation 'androidx.core:core:1.13.1'
}
