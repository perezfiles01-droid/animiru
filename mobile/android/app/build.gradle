plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animiru.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.animiru.app"
        minSdk 21
        targetSdk 34
        /*
         * The build's own version, not a constant.
         *
         * These were hardcoded, so every APK ever built - v1.0.108,
         * v1.0.115, v1.0.117 - told Android it was version code 1, name
         * 1.0.0. The release tag and the version compiled into the web
         * bundle both came from the CI run number; the package metadata was
         * never joined up to them.
         *
         * Android reads an install whose version code has not increased as
         * reinstalling the same app rather than updating it, and several
         * OEM installers refuse it outright - which leaves uninstalling
         * first as the only way through, and uninstalling deletes the app
         * storage holding the library, sources and settings.
         *
         * A local build has no run number and stays at 1: it is not
         * updating anything.
         */
        versionCode (project.findProperty('animiruVersionCode') ?: '1') as Integer
        versionName (project.findProperty('animiruVersionName') ?: '1.0.0')
    }

    /**
     * A stable signing key, supplied by CI.
     *
     * Android refuses to install an update whose signature differs from the
     * installed app, and the only way past that is uninstalling - which
     * deletes app storage, and with it the library, sources and settings the
     * WebView keeps. Every build used to be signed with the debug key, and
     * CI holds no keystore, so the Android plugin generated a fresh one on
     * each runner: every release was signed differently and no update could
     * ever install over the last. That is the bug this fixes.
     *
     * Absent - a local build, a fork without the secret - signing falls back
     * to the debug key, so `./gradlew assembleDebug` still works. Such
     * builds simply cannot update each other, which was already true.
     */
    signingConfigs {
        stable {
            def store = System.getenv('ANIMIRU_KEYSTORE_PATH')
            if (store && file(store).exists()) {
                storeFile file(store)
                storePassword System.getenv('ANIMIRU_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANIMIRU_KEY_ALIAS') ?: 'animiru'
                keyPassword System.getenv('ANIMIRU_KEY_PASSWORD')
                        ?: System.getenv('ANIMIRU_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            // The published APK is this one, so it is the build that has to
            // carry the stable key.
            signingConfig signingConfigs.stable.storeFile != null
                    ? signingConfigs.stable
                    : signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.stable.storeFile != null
                    ? signingConfigs.stable
                    : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    // FileProvider, and ContextCompat.registerReceiver with the exported
    // flag that API 33 requires. Both arrive transitively through appcompat,
    // but the update flow breaks on an older core and depending on it
    // explicitly says which version that is.
    implementation 'androidx.core:core:1.13.1'

    // Kotlin 1.8 merged kotlin-stdlib-jdk7 and -jdk8 into kotlin-stdlib.
    // androidx.core brings the merged 1.8 stdlib while appcompat still asks
    // for the split 1.6 artifacts, and having both on the classpath fails
    // the build with a wall of duplicate classes. Raising the split
    // artifacts to the same version makes them empty shims that defer to the
    // merged one, which is JetBrains' own remedy.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'aligns with the kotlin-stdlib that androidx.core requires'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'aligns with the kotlin-stdlib that androidx.core requires'
        }
    }
}
