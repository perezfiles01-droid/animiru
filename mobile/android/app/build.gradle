plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animiru.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.animiru.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }

        release {
            // Signed with the debug key so `assembleRelease` produces an
            // installable APK without a checked-in keystore. Replace with a
            // real signingConfig before any store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    // FileProvider, and ContextCompat.registerReceiver with the exported
    // flag that API 33 requires. Both arrive transitively through appcompat,
    // but the update flow breaks on an older core and depending on it
    // explicitly says which version that is.
    implementation 'androidx.core:core:1.13.1'

    // Kotlin 1.8 merged kotlin-stdlib-jdk7 and -jdk8 into kotlin-stdlib.
    // androidx.core brings the merged 1.8 stdlib while appcompat still asks
    // for the split 1.6 artifacts, and having both on the classpath fails
    // the build with a wall of duplicate classes. Raising the split
    // artifacts to the same version makes them empty shims that defer to the
    // merged one, which is JetBrains' own remedy.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'aligns with the kotlin-stdlib that androidx.core requires'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'aligns with the kotlin-stdlib that androidx.core requires'
        }
    }
}
