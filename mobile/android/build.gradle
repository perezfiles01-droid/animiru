// Top-level build file.
//
// Note: repositories are declared ONLY in settings.gradle. Adding an
// `allprojects { repositories { ... } }` block here conflicts with
// RepositoriesMode.FAIL_ON_PROJECT_REPOS and fails the build.
plugins {
    id 'com.android.application' version '8.5.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
